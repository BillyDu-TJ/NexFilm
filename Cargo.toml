[package]
name = "nexfilm_engine"
version = "1.0.0"
edition = "2021"
description = "Scientific Film Inversion Engine"
license = "GPL-3.0-only"
repository = "https://github.com/BillyDu-TJ/NexFilm"

[dependencies]
nalgebra = "0.32"
image = "0.24"
tiff = "0.9.1"
rayon = "1.8"
clap = { version = "4.5", features = ["derive"] }
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["sync"] }
base64 = "0.22"
rfd = "0.14"
imageproc = "0.23"
flate2 = "1.1"
rawlib = "0.7.1"
dashmap = "6.2.1"
tauri-plugin-dialog = "2.7.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# Keep image processing responsive in `cargo tauri dev` while retaining debug symbols.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
