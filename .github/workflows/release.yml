name: Build and Release NexFilm 1.2.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.2.1"
        required: true
        default: "v1.2.1"
        type: string

permissions:
  contents: write

jobs:
  # 第一步：统一验证代码（在 Linux 上跑最快，验证成功才打包）
  verify:
    name: Verify source code
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install pkg-config libraw # 👈 关键修复 2：安装 0.22+ 版本的 LibRaw 供测试使用

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run checks and verifications
        run: |
          cargo fmt --check
          cargo test --locked --lib
          node --check ui/main.js
          node --check ui/geometry.js
          node --check ui/contact-sheet.js
          node --check ui/density-math.js
          node --check ui/tone-curve.js
          node --test ui/tone-curve.test.js
          node scripts/verify-contact-sheet.cjs
          node scripts/verify-density-contract.cjs
          node scripts/verify-histogram-contract.cjs
          node scripts/verify-geometry-contract.cjs
          node scripts/verify-ui-startup-order.cjs
          node scripts/verify-runtime-assets.cjs
          node scripts/verify-slider-contract.cjs

  # 第二步：矩阵并发编译三大平台
  build-and-release:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles nsis
          
          - name: macOS Apple Silicon (M-Series)
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            
          - name: macOS Intel (x86)
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Installer and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "NexFilm ${{ inputs.tag }}"
          releaseBody: |
            NexFilm ${{ inputs.tag }} 正式版。

            从界面与功能形态上看，`v1.2.1` 没有新增复杂的调节面板，聚焦于**解码稳定性、源文件兼容性、片基反相一致性与异常报错清晰度**；但在底层工程上，这一版对直接 RGB 线性化、宽色域/合并 DNG 解码、片基状态锚定与报错诊断做了大范围重构，使各类实际拍摄与扫描源文件都能更可靠地走通统一物理密度管线。

            ### 主要更新与底层改进
            - **直接 RGB 与扫描 JPEG / PNG / TIFF 直通 ProPhoto f32**：扫描得到的 JPEG、PNG 与 TIFF 不再经由 16 位线性 sRGB 中转，也不在进入密度域前做亮度色度压缩；接入 `moxcms` 真实 ICC 色度与传递曲线解析（含线性 TRC 保护与 EOTF 修正）、`f32` / `f64` 浮点 TIFF 保留、EXIF 方向校正及显式内存预算保护，**正常扫描仪导出的 JPEG（及无边框扫描件）自 v1.2.1 起可直接获得稳定、可靠的反相效果**。
            - **完整 LinearRaw / Lightroom 拼接合并 DNG 支持**：同时兼容 IFD0 与 SubIFD 结构的 LinearRaw DNG；支持通过 `rawler` 解码压缩 LinearRaw 数据，并在裁切和降采样之前先执行 DNG Stage-2 `OpcodeList2`（`MapTable` / `MapPolynomial`）逆色调映射；结合内嵌 ICC 或 `ColorMatrix1/2` + `AsShotNeutral` 双光源白平衡还原线性色彩，解决全景合并或第三方 DNG 偏色、高光失真与解码失败问题。
            - **统一解码入口、片基状态分离与高光保护**：统一预览、Roll 锚点采样、Contact Sheet 与批量导出使用的现代解码入口（`RAW_DECODE_VERSION = 15`，`DENSITY_WINDOW_RULE_VERSION = 6`）；区分可信片基（`Trusted`）与内容兜底（`ContentFallback`），可信片基锚定在 `d_min = 0`，无片基画面保留独立低密度端避免高光死白，升级后会自动失效受影响的旧缓存与 Roll 锚点并重算。
            - **Canon `.CR2` 预览提取与 135 齿孔边界恢复**：嵌入 JPEG 预览仅接受 8-bit 1/3 通道基准/渐进 JPEG 并主动跳过带有 `CR2Slices`（`0xC640`）或 RAW Photometric 标签的 IFD，避免高像素 `.CR2` 误将数十 MB 的无损传感器切片当作缩略图；为带横向 `3:2` 比例线索的 135 扫描件加入内缩边界恢复逻辑，降低上/下片门误锁定至胶片最外侧齿孔边沿的概率。
            - **管线退化告警与一键复制诊断**：针对内嵌 ICC 解析失败、相机矩阵退化、DNG 布局/元数据缺失、扫描仪记录缺失、硬件校正回退以及导入 / 自动反相 / 片门识别 / Develop / 批量导出异常提供清晰阶段提示，并在 Toast 中支持**“复制诊断”**（`NexFilm v1.2.1 | stage=...`），便于排查稀奇古怪的异常源文件。

            ### 升级提示
            - 由于 `v1.2.1` 升级了输入解码与统一密度窗口版本，打开此前版本建立的胶卷时，受影响帧会刷新缓存并按新管线计算；如个别既有画面仍保留旧缩略图或锚点提示，可对该帧或整卷重新执行一次 **Auto Invert**。

            ### 已知限制
            - 硬件校正相关能力（Capture Corrected、Capture Characterized、扫描仪输入配置）仍为实验性。
            - 超大 JPEG/PNG 仍受解码器显式内存上限约束，极高像素素材仍建议使用 16-bit TIFF 或 DNG 以保留位深与流式解码优势。
            - 全分辨率导出大型扫描件需要较大的可用内存。
            - Nikon **HE/HE*** 专利高效率压缩格式的 NEF 文件因开源解码库（LibRaw / `rawler`）均暂不支持解码，目前无法直接导入（软件会识别并提示改用标准/无损 NEF 或转换后导入）。

            ### 📥 下载指南 (Download)
            - **Windows 用户**：请下载包含 `nsis` 和 `x86_64` 的 `.exe` 安装程序。
            - **Mac (Apple Silicon)**：请下载包含 `aarch64` 的 `.dmg`。
            - **Mac (Intel)**：请下载包含 `x86_64` 的 `.dmg`。
            
            ⚠️ *Note: Mac 安装包暂未签名，如提示“文件损坏”，请在终端运行 `xattr -cr "/Applications/NexFilm Engine.app"`。*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
