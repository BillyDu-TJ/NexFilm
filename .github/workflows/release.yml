name: Build and Release NexFilm 1.2.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.2.0"
        required: true
        default: "v1.2.0"
        type: string

permissions:
  contents: write

jobs:
  # 第一步：统一验证代码（在 Linux 上跑最快，验证成功才打包）
  verify:
    name: Verify source code
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install pkg-config libraw # 👈 关键修复 2：安装 0.22+ 版本的 LibRaw 供测试使用

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run checks and verifications
        run: |
          cargo fmt --check
          cargo test --locked --lib
          node --check ui/main.js
          node --check ui/geometry.js
          node --check ui/contact-sheet.js
          node --check ui/density-math.js
          node --check ui/tone-curve.js
          node --test ui/tone-curve.test.js
          node scripts/verify-contact-sheet.cjs
          node scripts/verify-density-contract.cjs
          node scripts/verify-histogram-contract.cjs
          node scripts/verify-geometry-contract.cjs
          node scripts/verify-ui-startup-order.cjs
          node scripts/verify-runtime-assets.cjs
          node scripts/verify-slider-contract.cjs

  # 第二步：矩阵并发编译三大平台
  build-and-release:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles nsis
          
          - name: macOS Apple Silicon (M-Series)
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            
          - name: macOS Intel (x86)
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Installer and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "NexFilm ${{ inputs.tag }}"
          releaseBody: |
            NexFilm ${{ inputs.tag }} 正式版。

            这一版主要解决了实际用起来最碍事的几块：相机 RAW 高光与暗部偏色、自动框选片门框不准、Contact Sheet 直接闷头导出清晰度不够，以及裁切、曲线和尺孔的几个手感毛病。

            ### 主要更新
            - **相机 RAW 改在原生色域反相**：相机 RAW 不再在反相前提前挤进 ProPhoto，直接用传感器原生 RGB 算密度，再做高光滚降和欠曝色彩保护，蓝天、水面不容易发青发灰；同时修了竖拍 RAW 占位图、预览与导出方向不一致（打开延迟跳变）和导出偶发偏黄的问题。
            - **底层解码升级**：Windows 和 macOS 统一到 LibRaw 0.22.2，并补上 `rawler` 解码通路（对哈苏等机型和压缩格式的提示也更清楚）。
            - **自动框选胶片范围更稳**：分析提到 640px 面积降采样并结合同卷前几张的位置稳定框选，识别结果微收一点防灯板漏进统计，算不准时退回居中 80% 安全框；新增 `[3:2]` `[1:1]` `[6:7]` `[自由]` 比例锁，支持整框拖动和单边微调。
            - **Contact Sheet 预览弹窗与重绘导出**：点击导出先打开大预览窗确认排版，可自选文件名、保存目录、JPEG / 无损 PNG 和三档清晰度（3000 / 4500 / 6000 px）；自带片边和齿孔的翻拍底片关掉“绘制胶片边框”就不会叠出两层边框。导出时按格子尺寸逐帧重绘正片后再拼图。
            - **裁切、曲线与尺孔手感**：裁切旋转改得和拉直一样顺滑，滑块和画布按住 `Shift` 可精细微调；曲线首尾点可横向自由拖动（端点外自动拉平）并带实时输入/输出读数；修复尺孔采样和预览不一致，跨帧粘贴遇到轻微错位也不容易漏孔。
            - **使用文档迁至官网**：移除应用内置的离线文档视图，完整中英文手册统一在官网与 `docs/handbook/` 维护，软件顶栏更加聚焦于核心修图工作流。

            ### 致谢

            - 感谢 `jacky_tan` 在 [PR #10](https://github.com/BillyDu-TJ/NexFilm/pull/10) / [PR #12](https://github.com/BillyDu-TJ/NexFilm/pull/12) 中贡献相机原生 RGB 反相主路径、显示矩阵传递与 RAW 预览方向修正。

            ### 已知限制
            - 硬件校正相关能力（Capture Corrected、Capture Characterized、扫描仪输入配置）仍为实验性。
            - 超大 JPEG/PNG 受解码器内存上限约束，可能提示解码失败，建议改用 TIFF 或 DNG。
            - 全分辨率导出大型扫描件需要较大的可用内存。
            - Nikon Z8 的 HE/HE* 高效率 RAW 文件因 LibRaw 暂不支持解码，目前无法导入。

            ### 📥 下载指南 (Download)
            - **Windows 用户**：请下载包含 `nsis` 和 `x86_64` 的 `.exe` 安装程序。
            - **Mac (Apple Silicon)**：请下载包含 `aarch64` 的 `.dmg`。
            - **Mac (Intel)**：请下载包含 `x86_64` 的 `.dmg`。
            
            ⚠️ *Note: Mac 安装包暂未签名，如提示“文件损坏”，请在终端运行 `xattr -cr "/Applications/NexFilm Engine.app"`。*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
