name: Build and Release NexFilm 1.1.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.0"
        required: true
        default: "v1.1.0"
        type: string

permissions:
  contents: write

jobs:
  # 第一步：统一验证代码（在 Linux 上跑最快，验证成功才打包）
  verify:
    name: Verify source code
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install pkg-config libraw # 👈 关键修复 2：安装 0.22+ 版本的 LibRaw 供测试使用

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run checks and verifications
        run: |
          cargo fmt --check
          cargo test --locked --lib
          node --check ui/main.js
          node --check ui/geometry.js
          node --check ui/contact-sheet.js
          node --check ui/density-math.js
          node scripts/verify-contact-sheet.cjs
          node scripts/verify-density-contract.cjs
          node scripts/verify-histogram-contract.cjs
          node scripts/verify-geometry-contract.cjs
          node scripts/verify-ui-startup-order.cjs
          node scripts/verify-runtime-assets.cjs
          node scripts/verify-slider-contract.cjs

  # 第二步：矩阵并发编译三大平台
  build-and-release:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles nsis
          
          - name: macOS Apple Silicon (M-Series)
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            
          - name: macOS Intel (x86)
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Installer and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "NexFilm ${{ inputs.tag }}"
          releaseBody: |
            NexFilm ${{ inputs.tag }} 正式版。

            本版主题是把**输入类型与密度数学分开**：输入类型只决定"这段数据属于什么输入域"，反相与密度计算全部使用同一套实现。

            ### 新功能
            - **统一密度管线**：输入域（内嵌 ICC、扫描仪容器记录、RAW 元数据、机型识别或 sRGB 兜底）逐帧解析并记录；密度数学统一为逐通道扣除片基 → 光学密度 → 共享窗口原点 → 有界通道跨度响应，正常素材不受影响。
            - **整卷白点与批量反相**：按整卷最亮画面标定一次共享白点；片基与片头被采样的画面视为标定素材，自动排除在 Develop、白点测量与批量反相之外，并在进度中报告跳过数量。
            - **硬件校正（实验性）**：新增硬件校正视图与校正配置，可收集 dark / open gate / flat / 透射目标并绑定到胶卷；Capture Corrected 让 dark/open 参与像素计算，Capture Separation 3×3 可由实测色卡拟合，条件不足时自动回退 Smart Auto 并说明原因。
            - **扫描仪输入配置**：可导入本地扫描仪配置文件并绑定到胶卷，作用于预览与导出。
            - **新的交付格式**：线性 16 位 TIFF、线性 DNG，以及原样封装扫描 RAW 的相机 RAW DNG。
            - **胶卷备注**与**内置使用文档**（9 章中英双语，完全离线）。

            ### 修复与优化
            - 扫描件改用按行流式解码：数百兆到 GB 级的 FFF、扫描仪 TIFF 与线性 DNG 都能打开；大尺寸扫描件"Develop 能看、导出失败"的问题同时修复。
            - `.fff` 识别不再依赖 FlexColor 写下的设备字符串，缺少该标记的 Imacon/Flextight 扫描件不会再被误判为哈苏相机 RAW（即 1.0.2 中"导入 fff 无法解码"的原因）。
            - 流式 TIFF 读取器增加几何与文件长度一致性校验，异常头部返回明确错误而不是拖垮进程。
            - 反相：短调画面保持原有影调性格；拼接白边、白灯板与高光溢出不再参与窗口端点；继承的片基会在本画面自己的像素上重新测量。
            - 散张导入与按卷未标定观感不再分叉；导入阶段不再解算 RAW，首次进入 Develop 才生成有界代理。
            - 界面：Develop 检查器重新分组，新增对比度并收紧曝光/高光/阴影范围；裁切与胶片范围共用同一画面坐标系；打开画面不再自动取消遮罩。

            ### 升级提示
            - 升级后请对旧胶卷重新执行一次 **Auto Invert**：本次迁移会清除用旧密度配方渲染的缩略图，避免缩略图与实际渲染不一致。

            ### 已知限制
            - 硬件校正相关能力（Capture Corrected、Capture Characterized、扫描仪输入配置）仍为实验性。
            - 超大 JPEG/PNG 受解码器内存上限约束，可能提示解码失败，建议改用 TIFF 或 DNG。
            - 全分辨率导出大型扫描件需要较大的可用内存。
            - Nikon Z8 的 HE/HE* 高效率 RAW 文件因 LibRaw 暂不支持解码，目前无法导入。

            ### 📥 下载指南 (Download)
            - **Windows 用户**：请下载包含 `nsis` 和 `x86_64` 的 `.exe` 安装程序。
            - **Mac (Apple Silicon)**：请下载包含 `aarch64` 的 `.dmg`。
            - **Mac (Intel)**：请下载包含 `x86_64` 的 `.dmg`。
            
            ⚠️ *Note: Mac 安装包暂未签名，如提示“文件损坏”，请在终端运行 `xattr -cr "/Applications/NexFilm Engine.app"`。*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
