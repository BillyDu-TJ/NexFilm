name: Mirror release assets

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example v1.2.1"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.2.1"
        required: true
        default: "v1.2.1"
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Copy GitHub assets to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify mirror configuration
        shell: bash
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET"
          aws --version
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Copy release assets to R2
        shell: bash
        run: node scripts/sync-release-to-r2.mjs --tag "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://dl.nexfilm.tech' }}
