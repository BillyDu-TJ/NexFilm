name: Build Windows Preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Unique release tag, for example v0.1.0-preview.1"
        required: true
        default: "v0.1.0-preview.1"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust and frontend code
        shell: pwsh
        run: |
          cargo fmt --check
          cargo test --locked --lib
          node --check ui/main.js
          node --check ui/geometry.js
          node scripts/verify-geometry-contract.cjs
          node scripts/verify-ui-startup-order.cjs
          node scripts/verify-webgl-shaders.cjs

      - name: Build installer and publish pre-release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "NexFilm Engine ${{ inputs.tag }}"
          releaseBody: |
            Windows development preview. Download the NSIS .exe installer from Assets.

            Windows 开发预览版。请在 Assets 中下载 NSIS .exe 安装程序。
          releaseDraft: false
          prerelease: true
          args: --bundles nsis
          releaseAssetNamePattern: "[name]-[version]-[arch]-[bundle][ext]"
